services:
  nginx:
    image: nginx:alpine
    container_name: bewerbung_nginx
    ports:
      - "8082:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - app-network

  php:
    image: php:8.4-fpm-alpine 
    container_name: bewerbung_php
    volumes:
      - .:/var/www
    networks:
      - app-network

networks:
  app-network:
    driver: bridge